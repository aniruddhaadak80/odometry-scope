name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4 # v3.28.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4 # v3.28.9
      - uses: github/codeql-action/analyze@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4 # v3.28.9
